version: '3.8'
services:
  user-service-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/data/postgres-user-service
    volumes:
      - ./postgres-user-service-data:/data/postgres-user-service
    networks:
      - user-network

  user-service-redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped
    volumes:
      - ./redis-data:/data/redis-user-service
    networks:
      - user-network

  user-service:
    build: .
    restart: always
    ports:
      - '8081:8081'
    depends_on:
      - user-service-postgres
      - user-service-redis
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM}
      - SPRING_LIQUIBASE_CHANGELOG=${SPRING_LIQUIBASE_CHANGELOG}
      - APP_PAYMENT_CARD_ENCRYPTION_BASE64_KEY=${APP_PAYMENT_CARD_ENCRYPTION_BASE64_KEY}
    networks:
      - user-network

networks:
  user-network:
    driver: bridge